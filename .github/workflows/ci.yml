name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # Unit tests plus integration tests against a fake `claude` stub. No real Claude Code, no network.
      - name: Test
        run: swift test

      # RELEASE=1: universal, ad-hoc signed app + zip, the same artifact the Homebrew cask installs.
      - name: Package
        run: RELEASE=1 Scripts/package_app.sh

  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4

      # The engine and the CLI (no menu-bar app on Linux), same tests against the fake `claude` stub.
      - name: Test
        run: swift test

      - name: Package
        run: swift build -c release --static-swift-stdlib --product sessionhopper
